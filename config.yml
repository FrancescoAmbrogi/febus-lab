baseURL: "https://febus-lab.github.io" 
title: FEBUS lab
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: People
          url: people/
          weight: 5 
        - name: Publications
          url: publications/
          weight: 1
        - name: Presentations
          url: presentations
          weight: 2
        - name: Projects
          url: projects/
          weight: 3
        - name: Teaching
          url: courses/
          weight: 4
        - name: Open learning
          url: open-learning/
          weight: 6
        - name: News
          url: news/
          weight: 7 
        - name: Dr. Ambrogi
          url: https://francescoambrogi.github.io/my-portfolio
          weight: 8

params:
    description: "Welcome to the official website of the Queen's University FEBUS lab where we use modern computational tools to push the boundaries of our understanding of fluid systems."
    author: Dr. Francesco Ambrogi
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: auto
    hideFooter: false
    disableThemeToggle: false
    ShowShareButtons: false
    ShowReadingTime: true
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["Publications","Presentations","people","courses","projects","news"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Fluids, Energy, and Bio-inspired Unsteady Simulations lab
          subtitle: "Welcome to the official website of the Queen's University FEBUS lab where we use modern computational tools to push the boundaries of our understanding of fluid systems."
          imageUrl: "home-pic.png"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Publications
              url: publications/
            - name: Presentations
              url: presentations/
            - name: Projects
              url: projects/
            - name: News
              url: news/
            - name: People
              url: people/
            - name: Teaching
              url: courses/
            - name: Open learning
              url: open-learning/

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Location
          url: location/
        - name: Office Hours
          url: officehours/
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=Xmie4zcAAAAJ&hl=en&oi=ao
        - name: GitHub
          url: https://github.com/FrancescoAmbrogi/
        - name: YouTube
          url: https://www.youtube.com/@ambrogifra-fluids

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "FEBUS lab"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2

caches:
  images:
    dir: :cacheDir/images
